<html lang="ru" data-palette="bordeaux">
<head>

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6eeea">

  <!-- Превью при отправке ссылки (Telegram, VK, соцсети).
       Адреса картинок ДОЛЖНЫ быть абсолютными. Если репозиторий или аккаунт
       называются иначе — поправь адрес ниже. -->
  <link rel="canonical" href="https://vanilla-bun.github.io/linkbio/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vanilla Bun">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Vanilla Bun — музыкальный стример">
  <meta property="og:description" content="Кавера, свои песни и уютные стримы. Четверг и воскресенье в 19:00 (МСК). Все ссылки здесь.">
  <meta property="og:url" content="https://vanilla-bun.github.io/linkbio/">
  <meta property="og:image" content="https://vanilla-bun.github.io/linkbio/assets/og.jpg">
  <meta property="og:image:width" content="1200">

  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Тема ставится ДО отрисовки, чтобы не было вспышки светлой темы -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("lb-theme");          // "light" | "dark" | null
        var dark = saved ? saved === "dark"
                         : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]')
                .setAttribute("content", dark ? "#1d0f13" : "#f6eeea");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

</body>
